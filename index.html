let mode, target, score = 0, locked = false, tanyaSuara = false;

// ================= SUARA UCAPAN =================
const _utt = [];
function say(t, onend){
  let selesai = false;
  const fin = () => { if(!selesai){ selesai = true; if(onend) onend(); } };
  try{
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'id-ID'; u.rate = .9; u.pitch = 1; u.volume = 1;
    u.onend = fin; u.onerror = fin;
    _utt.push(u); if(_utt.length > 10) _utt.shift(); // cegah dibuang Chrome
    speechSynthesis.resume();
    speechSynthesis.speak(u);
    setTimeout(fin, 6000 + t.length*150);
  }catch(e){ fin(); }
}
function speak(t){
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(() => say(t), 150);
}

// ================= DAFTAR NAMA ANAK =================
const KUNCI_LIST = 'belajar_daftar_nama';
const KUNCI_PILIH = 'belajar_nama_aktif';
let DAFTAR_NAMA = [...NAMA_AWAL];

function muatNama(){
  try{
    const l = JSON.parse(localStorage.getItem(KUNCI_LIST) || 'null');
    if(Array.isArray(l) && l.length) DAFTAR_NAMA = l.filter(x => typeof x === 'string' && x);
    if(!DAFTAR_NAMA.length) DAFTAR_NAMA = [...NAMA_AWAL];
    const p = localStorage.getItem(KUNCI_PILIH);
    NAMA = (p && DAFTAR_NAMA.indexOf(p) > -1) ? p : DAFTAR_NAMA[0];
  }catch(e){
    NAMA = DAFTAR_NAMA[0];
  }
}
function simpanNama(){
  try{
    localStorage.setItem(KUNCI_LIST, JSON.stringify(DAFTAR_NAMA));
    localStorage.setItem(KUNCI_PILIH, NAMA);
  }catch(e){}
}
function renderNama(){
  const box = $('namaList');
  box.innerHTML = '';
  DAFTAR_NAMA.forEach(n => {
    const b = document.createElement('button');
    b.className = 'nm' + (n === NAMA ? ' aktif' : '');
    b.textContent = n;
    b.onclick = () => pilihNama(n);
    box.appendChild(b);
  });
}
function pilihNama(n){
  NAMA = n;
  simpanNama();
  renderNama();
  try{ getAC(); }catch(e){}
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  speak(`Halo ${n}! Ayo belajar`);
}
function tambahNama(){
  if(DAFTAR_NAMA.length >= MAKS_NAMA){
    alert('Daftar nama sudah penuh (maksimal ' + MAKS_NAMA + '). Hapus salah satu dulu.');
    return;
  }
  let n = prompt('Tulis nama anak:');
  if(!n) return;
  n = n.trim().replace(/\s+/g,' ').slice(0,20);
  if(!n) return;
  n = n.charAt(0).toUpperCase() + n.slice(1);
  const sudah = DAFTAR_NAMA.some(x => x.toLowerCase() === n.toLowerCase());
  if(sudah){ alert('Nama ' + n + ' sudah ada.'); return; }
  DAFTAR_NAMA.push(n);
  pilihNama(n);
}
function hapusNama(){
  if(DAFTAR_NAMA.length <= 1){
    alert('Minimal harus ada satu nama.');
    return;
  }
  if(!confirm('Hapus nama ' + NAMA + '?')) return;
  DAFTAR_NAMA = DAFTAR_NAMA.filter(x => x !== NAMA);
  NAMA = DAFTAR_NAMA[0];
  simpanNama();
  renderNama();
}

// ================= NADA & SUARA BUATAN =================
let ac;
function getAC(){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
// not: [tipe, freqAwal, freqAkhir, mulai(detik), durasi(detik), volume]
function mainkan(notes){
  try{
    const a = getAC();
    let total = 0;
    notes.forEach(([tipe,f0,f1,t,d,v]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = tipe;
      const t0 = a.currentTime + t;
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.linearRampToValueAtTime(f1, t0 + d);
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(v, t0 + Math.min(.05, d/3));
      g.gain.exponentialRampToValueAtTime(.001, t0 + d);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + d + .02);
      total = Math.max(total, t + d);
    });
    return total;
  }catch(e){ return 0; }
}

// ================= SUARA HEWAN (maks DURASI_MAKS detik, bisa diatur per hewan) =================
const DURASI_MAKS = 2; // detik, ubah angka ini kalau mau lebih pendek/panjang

function suaraHewan(h, done){
  const maks = h.maks || DURASI_MAKS;   // batas durasi per hewan
  let selesai = false;
  const fin = () => { if(!selesai){ selesai = true; done(); } };
  const cadangan = () => {
    if(selesai) return;
    const d = mainkan(SINTETIS[h.file] || []);
    setTimeout(fin, Math.min(d, maks)*1000 + 300);
  };
  const exts = ['mp3','wav','ogg','m4a'];
  const coba = i => {
    if(selesai) return;
    if(i >= exts.length){ cadangan(); return; }
    let lanjut = false, mulai = false;
    const berikut = () => { if(!lanjut && !mulai){ lanjut = true; coba(i+1); } };
    const a = new Audio(h.file + '.' + exts[i]);
    if(h.mulai){
      // lompati bagian sunyi di awal rekaman
      a.addEventListener('loadedmetadata', () => { try{ a.currentTime = h.mulai; }catch(e){} });
    }
    a.onplaying = () => {
      if(mulai) return;
      mulai = true;
      setTimeout(() => {
        const iv = setInterval(() => {
          if(a.volume > .1){ a.volume = Math.max(0, a.volume - .2); }
          else { clearInterval(iv); }
        }, 100);
      }, Math.max(0, maks*1000 - 500));
      setTimeout(() => { a.pause(); fin(); }, maks*1000);
    };
    a.onended = fin;
    a.onerror = berikut;
    const p = a.play();
    if(p && p.catch) p.catch(berikut);
    setTimeout(() => { if(!mulai){ a.pause(); berikut(); } }, 5000);
  };
  coba(0);
  setTimeout(fin, 15000);
}

// ================= SUARA HURUF HIJAIYAH (rekaman sendiri) =================
// Memutar huruf1.mp3 ... huruf28.mp3. Kalau file tidak ada, memakai suara sistem.
function suaraHuruf(h, done){
  let selesai = false;
  const fin = () => { if(!selesai){ selesai = true; if(done) done(); } };
  const cadangan = () => { if(!selesai) say(h.name, fin); };
  const exts = ['mp3','m4a','wav','ogg'];
  const coba = i => {
    if(selesai) return;
    if(i >= exts.length){ cadangan(); return; }
    let lanjut = false, mulai = false;
    const berikut = () => { if(!lanjut && !mulai){ lanjut = true; coba(i+1); } };
    const a = new Audio(h.file + '.' + exts[i]);
    a.onplaying = () => { mulai = true; };
    a.onended = fin;
    a.onerror = berikut;
    const p = a.play();
    if(p && p.catch) p.catch(berikut);
    setTimeout(() => { if(!mulai){ a.pause(); berikut(); } }, 5000);
  };
  coba(0);
  setTimeout(fin, 12000);
}

// ================= GAME JALAN =================
const JR = 4, JC = 3; // jumlah baris dan kolom (boleh diubah)
let jgrid = [], jpos = [0,0], jgoal = [0,0], jvisited = {};
const jkey = (r,c) => r + ',' + c;

function buatJalan(){
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  const sc = Math.floor(Math.random()*JC);
  const gc = Math.floor(Math.random()*JC);
  const goal = [JR-1, gc];
  const seen = {}, path = [];
  function dfs(r,c){
    seen[jkey(r,c)] = 1; path.push([r,c]);
    if(r === goal[0] && c === goal[1]) return true;
    for(const [dr,dc] of shuffle(dirs)){
      const nr = r+dr, nc = c+dc;
      if(nr<0 || nc<0 || nr>=JR || nc>=JC || seen[jkey(nr,nc)]) continue;
      if(dfs(nr,nc)) return true;
    }
    path.pop(); return false;
  }
  dfs(0, sc);
  jgrid = Array.from({length:JR}, () => Array(JC).fill(0));
  path.forEach(([r,c]) => jgrid[r][c] = 1);
  // jalan buntu (pengecoh)
  for(let r=0;r<JR;r++) for(let c=0;c<JC;c++){
    if(!jgrid[r][c] && Math.random() < .3) jgrid[r][c] = 1;
  }
  jpos = [0, sc]; jgoal = goal;
  jvisited = {}; jvisited[jkey(0,sc)] = 1;
}

function renderJalan(){
  const g = $('jgrid');
  g.style.gridTemplateColumns = `repeat(${JC},1fr)`;
  g.innerHTML = '';
  for(let r=0;r<JR;r++) for(let c=0;c<JC;c++){
    const b = document.createElement('button');
    let cls = 'jc', isi = '';
    if(!jgrid[r][c]){ cls += ' blok'; isi = '🌳'; }
    else if(jvisited[jkey(r,c)]) cls += ' lalu';
    if(r === jgoal[0] && c === jgoal[1]) isi = '🥕';
    if(r === jpos[0] && c === jpos[1]) isi = '🐰';
    b.className = cls; b.textContent = isi;
    b.onclick = () => tapJalan(b, r, c);
    g.appendChild(b);
  }
}

function renderJStars(){ $('jstars').textContent = '⭐'.repeat(Math.min(score,10)); }

function startJalan(){
  try{ getAC(); }catch(e){}
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  mode = 'jalan'; score = 0; renderJStars();

}

function ulangJalan(){
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(() => say('Bantu kelinci cari jalan ke wortel'), 150);

function tapJalan(btn, r, c){
  if(locked) return;
  try{ getAC(); }catch(e){}
  const jarak = Math.abs(r - jpos[0]) + Math.abs(c - jpos[1]);
  if(jarak !== 1){ // bukan kotak sebelah kelinci
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    return;
  }
  if(!jgrid[r][c]){ // pohon: salah
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    tingSalah();
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(() => say(`${NAMA} salah. Coba lagi ya ${NAMA}`), 450);
    return;
  }
  jpos = [r, c];
  jvisited[jkey(r,c)] = 1;
  renderJalan();
  if(r === jgoal[0] && c === jgoal[1]){
    locked = true; score++; renderJStars();
    confetti(); tingBenar();
    try{ speechSynthesis.cancel(); }catch(e){}
    let lanjut = false;
    const go = () => { if(!lanjut){ lanjut = true; nextJalan(); } };
    setTimeout(go, 15000); // cadangan
    setTimeout(() => {
      say(`Alhamdulillah, ${NAMA} betul!`);
      say(`Ayo lanjutkan ${NAMA}!`, go);
    }, 700);
  }
}

// ================= GAME SUSUN LANGKAH =================
const SR = 3, SC = 3;          // ukuran papan (baris x kolom)
const SJARAK = [2, 3];         // jarak kelinci ke wortel (jumlah langkah minimal)
const SMAKS = 6;               // maksimal panah yang boleh disusun
const PANAH = {atas:'⬆️', bawah:'⬇️', kiri:'⬅️', kanan:'➡️'};
const ARAH  = {atas:[-1,0], bawah:[1,0], kiri:[0,-1], kanan:[0,1]};
let sstart = [0,0], sgoal = [0,0], spos = [0,0], sseq = [], srun = false;

function buatSusun(){
  const jarakTarget = acak(SJARAK);
  let s, g, tries = 0;
  do {
    s = [Math.floor(Math.random()*SR), Math.floor(Math.random()*SC)];
    g = [Math.floor(Math.random()*SR), Math.floor(Math.random()*SC)];
    tries++;
  } while(Math.abs(s[0]-g[0]) + Math.abs(s[1]-g[1]) !== jarakTarget && tries < 200);
  sstart = s; sgoal = g; spos = [s[0], s[1]]; sseq = []; srun = false;
}

function renderSusun(){
  const g = $('sgrid');
  g.style.gridTemplateColumns = `repeat(${SC},1fr)`;
  g.innerHTML = '';
  for(let r=0;r<SR;r++) for(let c=0;c<SC;c++){
    const b = document.createElement('button');
    let isi = '';
    if(r === sgoal[0] && c === sgoal[1]) isi = '🥕';
    if(r === spos[0] && c === spos[1]) isi = '🐰';
    b.className = 'jc'; b.textContent = isi; b.disabled = true;
    g.appendChild(b);
  }
  renderSeq();
}
function renderSeq(){
  $('sseq').textContent = sseq.map(d => PANAH[d]).join(' ');
}
function renderSStars(){ $('sstars').textContent = '⭐'.repeat(Math.min(score,10)); }

function startSusun(){
  try{ getAC(); }catch(e){}
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  mode = 'susun'; score = 0; renderSStars();
  $('menu').classList.add('hidden');
  $('susun').classList.remove('hidden');
  nextSusun();
}
function nextSusun(){
  locked = false;
  buatSusun();
  renderSusun();
  setTimeout(ulangSusun, 400);
}
function ulangSusun(){
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(() => say('Susun panah supaya kelinci sampai ke wortel. Lalu tekan tombol hijau'), 150);
}

function tambahLangkah(d){
  if(srun || locked) return;
  try{ getAC(); }catch(e){}
  if(sseq.length >= SMAKS){ tingSalah(); return; }
  sseq.push(d);
  tingKlik();
  renderSeq();
}
function hapusLangkah(){
  if(srun || locked) return;
  sseq = [];
  renderSeq();
}

function jalankanSusun(){
  if(srun || locked) return;
  try{ getAC(); }catch(e){}
  if(!sseq.length){ tingSalah(); return; }
  srun = true;
  spos = [sstart[0], sstart[1]];
  renderSusun();
  let i = 0;
  const langkah = () => {
    if(!srun) return; // dibatalkan (tombol rumah)
    if(i >= sseq.length){ selesaiSusun(); return; }
    const d = ARAH[sseq[i]];
    const nr = spos[0] + d[0], nc = spos[1] + d[1];
    if(nr >= 0 && nc >= 0 && nr < SR && nc < SC){ spos = [nr, nc]; }
    tingKlik();
    renderSusun();
    i++;
    setTimeout(langkah, 650);
  };
  setTimeout(langkah, 400);
}

function selesaiSusun(){
  srun = false;
  if(spos[0] === sgoal[0] && spos[1] === sgoal[1]){
    locked = true; score++; renderSStars();
    confetti(); tingBenar();
    try{ speechSynthesis.cancel(); }catch(e){}
    let lanjut = false;
    const go = () => { if(!lanjut){ lanjut = true; nextSusun(); } };
    setTimeout(go, 15000); // cadangan
    setTimeout(() => {
      say(`Alhamdulillah, ${NAMA} betul!`);
      say(`Ayo lanjutkan ${NAMA}!`, go);
    }, 700);
  } else {
    tingSalah();
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(() => say(`${NAMA} salah. Coba lagi ya ${NAMA}`), 450);
    setTimeout(() => {
      spos = [sstart[0], sstart[1]];
      sseq = [];
      renderSusun();
    }, 1500);
  }
}

// ================= GAME COCOKKAN PASANGAN =================
const PASANG_JUMLAH = 3;   // jumlah pasangan (3 = 6 kartu). Untuk lebih sulit: 4 (8 kartu)
const PASANG_KOLOM = 3;    // jumlah kolom kartu
let pkartu = [], pbuka = [], pcocok = 0, plock = false, paktif = false;

function buatPasang(){
  const pilih = shuffle(DATA.hewan).slice(0, PASANG_JUMLAH);
  pkartu = shuffle([...pilih, ...pilih]).map(h => ({h: h, buka: false, selesai: false}));
  pbuka = []; pcocok = 0; plock = false;
}

function renderPasang(){
  const g = $('pgrid');
  g.style.gridTemplateColumns = `repeat(${PASANG_KOLOM},1fr)`;
  g.innerHTML = '';
  pkartu.forEach((k, i) => {
    const b = document.createElement('button');
    let cls = 'kartu';
    if(k.selesai) cls += ' cocok'; else if(k.buka) cls += ' buka';
    b.className = cls;
    b.textContent = (k.buka || k.selesai) ? k.h.view : '❓';
    b.onclick = () => tapKartu(i);
    g.appendChild(b);
  });
}
function renderPStars(){ $('pstars').textContent = '⭐'.repeat(Math.min(score,10)); }

function startPasang(){
  try{ getAC(); }catch(e){}
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  mode = 'pasang'; score = 0; paktif = true; renderPStars();
  $('menu').classList.add('hidden');
  $('pasang').classList.remove('hidden');
  nextPasang();
}
function nextPasang(){
  if(!paktif) return;
  buatPasang();
  renderPasang();
  setTimeout(ulangPasang, 400);
}
function ulangPasang(){
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(() => say('Cari dua gambar yang sama'), 150);
}

function tapKartu(i){
  if(plock || !paktif) return;
  const k = pkartu[i];
  if(k.buka || k.selesai) return;
  try{ getAC(); }catch(e){}
  k.buka = true;
  pbuka.push(i);
  tingKlik();
  renderPasang();
  speak(k.h.name);

  if(pbuka.length === 2){
    plock = true;
    const a = pkartu[pbuka[0]], b = pkartu[pbuka[1]];
    if(a.h.name === b.h.name){
      // SAMA
      setTimeout(() => {
        if(!paktif) return;
        a.selesai = true; b.selesai = true; a.buka = false; b.buka = false;
        pbuka = []; pcocok++;
        renderPasang();
        if(pcocok >= PASANG_JUMLAH){
          score++; renderPStars();
          confetti(); tingBenar();
          try{ speechSynthesis.cancel(); }catch(e){}
          let lanjut = false;
          const go = () => { if(!lanjut){ lanjut = true; nextPasang(); } };
          setTimeout(go, 15000); // cadangan
          setTimeout(() => {
            if(!paktif) return;
            say(`Alhamdulillah, ${NAMA} betul!`);
            say(`Ayo lanjutkan ${NAMA}!`, go);
          }, 700);
        } else {
          tingBenar();
          setTimeout(() => { if(paktif) say('Sama!'); }, 400);
          plock = false;
        }
      }, 900);
    } else {
      // BEDA
      setTimeout(() => {
        if(!paktif) return;
        tingSalah();
        try{ speechSynthesis.cancel(); }catch(e){}
        setTimeout(() => { if(paktif) say(`Belum sama. Coba lagi ya ${NAMA}`); }, 400);
      }, 900);
      setTimeout(() => {
        if(!paktif) return;
        a.buka = false; b.buka = false;
        pbuka = []; plock = false;
        renderPasang();
      }, 2300);
    }
  }
}

// ================= MULAI =================
muatNama();
renderNama();

// ================= PWA (bisa dipasang & offline) =================
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
